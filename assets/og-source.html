<!DOCTYPE html>
<!-- Fonte da imagem de prévia (Open Graph). Para regerar:
     chrome --headless --screenshot=assets/og.png --window-size=1200,630 assets/og-source.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0A0B0F;
    color: #E9EAEE;
    font-family: "Instrument Sans", sans-serif;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 86px 104px; /* recuo inferior empurra o bloco central para cima, dando ar à URL */
  }
  /* grade de blueprint */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, #1A1D26 1px, transparent 1px),
      linear-gradient(to bottom, #1A1D26 1px, transparent 1px);
    background-size: 62px 62px;
    -webkit-mask-image: radial-gradient(ellipse 85% 75% at 30% 40%, #000 0%, transparent 78%);
  }
  .glow {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    top: -220px; right: -160px; filter: blur(100px); opacity: .30;
    background: radial-gradient(circle, #2DE2C5, transparent 68%);
  }
  .glow2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    bottom: -220px; left: -120px; filter: blur(100px); opacity: .16;
    background: radial-gradient(circle, #FF6B4A, transparent 68%);
  }
  .content { position: relative; }

  .mark {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace; font-size: 15px;
    letter-spacing: .16em; text-transform: uppercase; color: #848A99;
    margin-bottom: 34px;
  }
  .mark b {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px;
    background: rgba(45,226,197,.12); border: 1px solid rgba(45,226,197,.28);
    color: #2DE2C5; font-size: 16px; font-weight: 700; letter-spacing: .04em;
  }

  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: 124px; line-height: .86; letter-spacing: -.055em;
  }
  h1 .stroke {
    display: block; color: transparent;
    -webkit-text-stroke: 2px #2DE2C5; padding-left: 6px;
  }

  .role {
    margin-top: 30px;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 32px; letter-spacing: -.02em; color: #A6AAB8;
  }
  .role em { font-style: normal; color: #2DE2C5; }

  .chips { display: flex; gap: 10px; margin-top: 38px; }
  .chips span {
    font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 500;
    padding: 9px 16px; border-radius: 999px;
    background: #14161E; border: 1px solid #232733; color: #A6AAB8;
  }

  .url {
    position: absolute; bottom: 54px; left: 86px;
    font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 700;
    letter-spacing: .02em; color: #2DE2C5;
  }
  .bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #2DE2C5, #FF6B4A);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="content">
    <p class="mark"><b>TG</b> Vitória, ES · Brasil</p>
    <h1>Thiago<span class="stroke">Gama</span></h1>
    <p class="role">Desenvolvedor Backend <em>/</em> Go</p>
    <div class="chips">
      <span>Go</span><span>Gin</span><span>GORM</span><span>PostgreSQL</span><span>Docker</span><span>C</span>
    </div>
  </div>

  <p class="url">thiagogama1.github.io</p>
  <div class="bar"></div>
</body>
</html>
